<!doctype html>
<!-- PROTOTYPE (throwaway). Q: 詳情頁（含時間軸）該用哪種版面？ 4 variants via ?variant=A|B|C|D, offline mock.
     A=時間軸主導(現 v1.1.27) | B=標籤頁切分(詳情/時間軸/金額) | C=手風琴摺疊 | D=雙欄(桌面) -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型 · 詳情版面</title>
<style>
:root{
--border:#e4e4e7;--bg:#fafafa;--card:#fff;--gray:#6f6f6f;--primary:#0091ff;--text:#222;
--success-bg:#dcfce7;--success-text:#166534;--warning-bg:#fef3c7;--warning-text:#92400e;
--danger-bg:#fee2e2;--danger-text:#991b1b;--info-bg:#e5e7eb;--info-text:#4b5563;
--fs-xs:12px;--fs-sm:13px;--fs-base:14px;--fs-md:16px;--fs-lg:20px;
--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC",sans-serif;background:var(--bg);color:var(--text);font-size:var(--fs-md);line-height:1.5;padding-bottom:70px}
.topbar{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.06);position:sticky;top:0;z-index:5}
.topbar h1{margin:0;font-size:var(--fs-lg);flex:1;font-weight:600}
.btn-icon{border:0;background:none;font-size:22px;line-height:1;padding:0 var(--sp-3)}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:var(--fs-xs);font-weight:600;line-height:1.6}
.badge-yellow{background:var(--warning-bg);color:var(--warning-text)}
.badge-green{background:var(--success-bg);color:var(--success-text)}
.badge-gray{background:var(--info-bg);color:var(--info-text)}
.card{background:var(--card);border-radius:8px;padding:var(--sp-3);box-shadow:0 1px 2px rgba(0,0,0,.05);margin:var(--sp-2)}
.detail-head{display:flex;align-items:center;gap:var(--sp-2)}
.detail-head h2{margin:0;font-size:var(--fs-lg);flex:1;font-weight:600}
.detail-line{margin:var(--sp-1) 0;font-size:var(--fs-base);color:var(--gray)}
.desc{margin:var(--sp-1) 0;font-size:var(--fs-base);color:var(--text)}
.section-title{margin:var(--sp-4) var(--sp-2) var(--sp-2);font-size:var(--fs-md);color:var(--gray);font-weight:600}
.photo-wall{display:flex;flex-wrap:wrap;gap:var(--sp-2);padding:var(--sp-2)}
.thumb{width:80px;height:80px;border-radius:8px;background:linear-gradient(135deg,#dde 0%,#bbd 100%)}
.timeline{padding:0 var(--sp-2)}
.update{padding:10px;border-left:3px solid var(--border);margin:var(--sp-2) 0;background:var(--card);border-radius:0 6px 6px 0}
.update.comment{border-left-color:var(--primary)}
.update.system{border-left-color:var(--gray)}
.update.status{border-left-color:var(--success)}
.update-head{font-size:var(--fs-base);color:var(--gray)}
.update-body{margin-top:var(--sp-1);font-size:var(--fs-base);color:var(--text)}
.amount-val{font-weight:600;color:var(--primary)}
.tabs{display:flex;overflow-x:auto;border-bottom:1px solid var(--border);background:var(--card)}
.tab{padding:var(--sp-3) var(--sp-4);background:none;border:none;border-bottom:2px solid transparent;color:var(--gray);white-space:nowrap;font-size:var(--fs-md)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:600}
.seg{display:flex;gap:var(--sp-1);padding:var(--sp-2) var(--sp-4);flex-wrap:wrap}
.seg button{padding:6px 12px;border:1px solid var(--border);border-radius:999px;background:var(--card);font-size:var(--fs-md)}
.seg button.active{border-color:var(--primary);background:var(--primary);color:#fff}
.acc-h{padding:var(--sp-3) var(--sp-4);background:var(--card);border-bottom:1px solid var(--border);font-weight:600}
.acc-b{padding:var(--sp-3) var(--sp-4);background:var(--card);border-bottom:1px solid var(--border)}
.dgrid{display:grid;grid-template-columns:1fr;gap:var(--sp-3);padding:var(--sp-2)}
@media (min-width:641px){.dgrid{grid-template-columns:1fr 1fr;align-items:start}}
</style>
<div id="app"></div>
<div id="bar" style="position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#222;color:#fff;padding:8px 14px;border-radius:999px;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:99"></div>
<script>
const T={id:101,no:'#0101',title:'3 樓走廊燈不亮',cat:'機電',loc:'A 區 3 樓',status:'in_progress',stLabel:'處理中',vendor:'大明水電',desc:'天花板燈管閃爍，需更換 LED 燈管。',amount:'3,500',amountAt:'2026-10-01',created:'2026-09-24',act:'2026-10-01'};
const UP=[
 {k:'status',head:'2026-10-01 陳管理 · 處理中',body:'已發包，金額 3,500'},
 {k:'comment',head:'2026-09-28 王委員',body:'燈管閃爍情況持續，請盡快處理'},
 {k:'system',head:'2026-09-24 系統',body:'建立案件'},
];
function badge(){return `<span class="badge badge-yellow">${T.stLabel}</span>`}
function head(){return `<header class="topbar"><h1>案件詳情</h1><button class="btn-icon">⋮</button></header>`}
function infoCard(){return `<div class="card"><div class="detail-head">${badge()}<h2>${T.title}</h2></div><div class="detail-line">類別：${T.cat} · 地點：${T.loc}</div><div class="detail-line">廠商：${T.vendor}</div><div class="detail-line">建立 ${T.created} · 最後活動 ${T.act}</div><div class="desc">${T.desc}</div></div>`}
function photos(){return `<div class="photo-wall"><div class="thumb"></div><div class="thumb"></div><div class="thumb"></div></div>`}
function up(u){return `<div class="update ${u.k}"><div class="update-head">${u.head}</div><div class="update-body">${u.body}</div></div>`}
function tl(){return `<h3 class="section-title">時間軸</h3><div class="timeline">`+UP.map(up).join('')+`</div>`}
function amountBox(){return `<div class="card"><div class="detail-line">發包金額：<span class="amount-val">NT$ ${T.amount}</span>（${T.amountAt}）</div></div>`}
// A 時間軸主導
const A=()=>head()+infoCard()+photos()+tl()+amountBox();
// B 標籤頁切分
function tabsBar(){return `<div class="tabs">`+['詳情','時間軸','金額'].map((t,i)=>`<button class="tab${i===0?' active':''}">${t}</button>`).join('')+`</div>`}
const B=()=>head()+tabsBar()+`<div class="seg">`+['詳情','時間軸','金額'].map((t,i)=>`<button class="${i===0?'active':''}">${t}</button>`).join('')+`</div>`+infoCard()+photos()+tl()+amountBox();
// C 手風琴摺疊
const C=()=>head()+
 `<div class="acc-h">案件資訊</div><div class="acc-b">${infoCard().replace(/<div class="card">|<\/div>$/g,'')}<div class="detail-line">廠商：${T.vendor}</div></div>`+
 `<div class="acc-h">照片</div><div class="acc-b">${photos()}</div>`+
 `<div class="acc-h">時間軸</div><div class="acc-b"><div class="timeline">`+UP.map(up).join('')+`</div></div>`;
// D 雙欄（桌面）
const D=()=>head()+`<div class="dgrid"><div>`+infoCard()+photos()+`</div><div>`+tl()+amountBox()+`</div></div>`;
const V={A,B,C,D},names={A:'時間軸主導',B:'標籤頁切分',C:'手風琴摺疊',D:'雙欄桌面'};
function key(){const p=new URLSearchParams(location.search);let k=(p.get('variant')||'A').toUpperCase();return V[k]?k:'A'}
function render(){const k=key();document.getElementById('app').innerHTML=V[k]();
 document.getElementById('bar').innerHTML=`<button style="border:0;background:#0091ff;color:#fff;border-radius:50%;width:28px;height:28px" onclick="go(-1)">‹</button><span>${k} (${names[k]})</span><button style="border:0;background:#0091ff;color:#fff;border-radius:50%;width:28px;height:28px" onclick="go(1)">›</button>`}
function go(d){const ks=Object.keys(V);let i=(ks.indexOf(key())+d+ks.length)%ks.length;const p=new URLSearchParams(location.search);p.set('variant',ks[i]);history.replaceState(null,'','?'+p.toString());render()}
document.addEventListener('keydown',e=>{const tn=document.activeElement&&document.activeElement.tagName;if(tn==='input'||tn==='textarea')return;if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1)});
render();
</script>
