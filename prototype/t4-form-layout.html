<!doctype html>
<!-- PROTOTYPE (throwaway). Q: 表單頁（新建/重新開啟/模板編輯）該用哪種版面？ 4 variants switchable via ?variant=A|B|C|D, offline mock data.
     A=垂直單欄(labels-on-top, 現 v1.1.27) | B=分步向導(stepper) | C=雙欄(label左/control右, 桌面) | D=網格對齊(2-up 密集) -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原型 · 表單版面</title>
<style>
:root{
--red:#e5484d;--yellow:#f5a524;--green:#30a46c;--blue:#0091ff;--gray:#6f6f6f;
--border:#e4e4e7;--bg:#fafafa;--card:#fff;--muted:#6f6f6f;--primary:#0091ff;--text:#222;
--success-bg:#dcfce7;--success-text:#166534;--warning-bg:#fef3c7;--warning-text:#92400e;
--danger-bg:#fee2e2;--danger-text:#991b1b;--info-bg:#e5e7eb;--info-text:#4b5563;
--fs-xs:12px;--fs-sm:13px;--fs-base:14px;--fs-md:16px;--fs-lg:20px;--fs-xl:24px;
--sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC",sans-serif;background:var(--bg);color:var(--text);font-size:var(--fs-md);line-height:1.5;padding-bottom:70px}
.topbar{display:flex;align-items:center;gap:var(--sp-2);padding:var(--sp-3) var(--sp-4);background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.06);position:sticky;top:0;z-index:5}
.topbar h1{margin:0;font-size:var(--fs-lg);flex:1;font-weight:600}
.num{font-feature-settings:"tnum";font-variant-numeric:tabular-nums}
.input,textarea,.select{width:100%;padding:8px var(--sp-3);border:1px solid var(--border);border-radius:6px;background:var(--card);font-size:var(--fs-base);font-family:inherit}
.input:focus,textarea:focus,.select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px #eaf6ff}
textarea{min-height:80px;resize:vertical}
.btn{padding:8px 14px;border:1px solid var(--border);border-radius:6px;background:var(--card);font-size:var(--fs-base)}
.btn-primary{background:var(--primary);color:#fff;border-color:var(--primary)}
.btn-block{width:100%;margin-top:var(--sp-4)}
.card{background:var(--card);border-radius:8px;padding:var(--sp-3);box-shadow:0 1px 2px rgba(0,0,0,.05);margin-bottom:var(--sp-3)}
.hint{color:var(--gray);font-size:var(--fs-sm)}
.formA label{display:block;font-weight:600;margin:var(--sp-3) 0 var(--sp-1);font-size:var(--fs-base)}
.steps{display:flex;gap:var(--sp-1);align-items:center;justify-content:center;margin:var(--sp-3) 0}
.steps .s{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--info-bg);color:var(--info-text);font-size:var(--fs-xs);font-weight:600}
.steps .s.on{background:var(--primary);color:#fff}
.steps .ln{width:18px;height:2px;background:var(--border)}
.stepq{font-weight:600;margin:var(--sp-2) 0 var(--sp-1)}
.pager{display:flex;gap:var(--sp-2);margin-top:var(--sp-4)}
.pager .btn{flex:1}
.defrow{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:var(--sp-3);padding:var(--sp-2) 0;border-bottom:1px solid var(--border)}
.defrow .k{font-weight:600;font-size:var(--fs-base);color:var(--muted)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-2) var(--sp-3)}
.g2 .cell{display:flex;align-items:center;gap:var(--sp-2)}
.g2 .cell label{width:56px;font-size:var(--fs-sm);color:var(--muted);font-weight:600;flex-shrink:0}
.g2 .full{grid-column:1 / -1}
@media (max-width:640px){.g2{grid-template-columns:1fr}}
.photo-wall{display:flex;gap:var(--sp-2);margin:var(--sp-2) 0}
.thumb{width:72px;height:72px;border-radius:6px;background:linear-gradient(135deg,#eaf6ff,#f3f6fa);border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;color:var(--muted);font-size:var(--fs-xs)}
</style>
<div id="app"></div>
<div id="bar" style="position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:#222;color:#fff;padding:8px 14px;border-radius:999px;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.25);z-index:99"></div>
<script>
const CATS=['機電','土木','清潔','其它'],LOCS=['A棟','B棟','地下室','中庭'];
function hdr(t){return `<header class="topbar"><button class="btn btn-ghost" style="border:0;background:none">← 返回</button><h1>${t}</h1></header>`}
function wall(){return `<div class="photo-wall"><span class="thumb">1</span><span class="thumb">2</span><span class="thumb">3</span></div>`}

// A: 垂直單欄 labels-on-top (現行 v1.1.27)
function A(){return hdr('新建修繕案件')+`<div class="card" style="padding:var(--sp-4)"><div class="formA">`
+`<label>類別</label><select class="select"><option>${CATS[0]}</option></select>`
+`<label>地點</label><select class="select"><option>${LOCS[0]}</option></select>`
+`<label>說明</label><textarea class="input">天花板燈管閃爍，需更換 LED 燈管</textarea>`
+`<label>照片</label>${wall()}`
+`<button class="btn btn-primary btn-block">送出建單</button></div></div>`}

// B: 分步向導 (stepper)
function B(){return hdr('新建修繕案件')+`<div class="card" style="padding:var(--sp-4)">`
+`<div class="steps"><span class="s on">1</span><span class="ln"></span><span class="s">2</span><span class="ln"></span><span class="s">3</span></div>`
+`<div class="stepq">步驟 1 / 3 · 分類</div>`
+`<select class="select"><option>${CATS[0]}</option><option>${CATS[1]}</option></select>`
+`<div class="pager"><button class="btn" style="visibility:hidden">.</button><button class="btn btn-primary">下一題 ›</button></div>`
+`<div class="hint" style="margin-top:var(--sp-3)">共 3 題：分類 → 地點 → 說明＋照片</div></div>`}

// C: 雙欄 label左/control右 (桌面)
function C(){return hdr('新建修繕案件')+`<div class="card" style="padding:var(--sp-4)">`
+`<div class="defrow"><span class="k">類別</span><select class="select"><option>${CATS[0]}</option></select></div>`
+`<div class="defrow"><span class="k">地點</span><select class="select"><option>${LOCS[0]}</option></select></div>`
+`<div class="defrow" style="align-items:start"><span class="k">說明</span><textarea class="input">天花板燈管閃爍，需更換 LED 燈管</textarea></div>`
+`<div class="defrow" style="align-items:start"><span class="k">照片</span>${wall()}</div>`
+`<button class="btn btn-primary btn-block">送出建單</button></div>`}

// D: 2-up 網格對齊 (密集)
function D(){return hdr('新建修繕案件')+`<div class="card" style="padding:var(--sp-4)"><div class="g2">`
+`<div class="cell"><label>類別</label><select class="select"><option>${CATS[0]}</option></select></div>`
+`<div class="cell"><label>地點</label><select class="select"><option>${LOCS[0]}</option></select></div>`
+`<div class="cell full"><label>說明</label><textarea class="input" style="min-height:64px">天花板燈管閃爍，需更換 LED 燈管</textarea></div>`
+`<div class="cell full"><label>照片</label>${wall()}</div>`
+`<div class="cell full"><button class="btn btn-primary btn-block">送出建單</button></div></div></div>`}

const V={A,B,C,D},names={A:'垂直單欄(現行)',B:'分步向導',C:'雙欄桌面',D:'網格對齊'};
function key(){const p=new URLSearchParams(location.search);let k=(p.get('variant')||'A').toUpperCase();return V[k]?k:'A'}
function render(){const k=key();document.getElementById('app').innerHTML=V[k]();
document.getElementById('bar').innerHTML=`<button style="border:0;background:#0091ff;color:#fff;border-radius:50%;width:28px;height:28px" onclick="go(-1)">‹</button><span>${k} (${names[k]})</span><button style="border:0;background:#0091ff;color:#fff;border-radius:50%;width:28px;height:28px" onclick="go(1)">›</button>`}
function go(d){const ks=Object.keys(V);let i=(ks.indexOf(key())+d+ks.length)%ks.length;const p=new URLSearchParams(location.search);p.set('variant',ks[i]);history.replaceState(null,'','?'+p.toString());render()}
document.addEventListener('keydown',e=>{const tn=document.activeElement&&document.activeElement.tagName;if(tn==='input'||tn==='textarea'||tn==='select')return;if(e.key==='ArrowLeft')go(-1);if(e.key==='ArrowRight')go(1)});
render();
</script>
