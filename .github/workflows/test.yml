name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

  # E2E 對已部署的 Pages 網域跑（部署由 Cloudflare GitHub 整合負責）
  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # 等 Cloudflare 部署完成，且部署版本 == 本次 commit（A7：避免測到舊版）
      - name: Wait for deployment and verify commit
        run: |
          EXPECTED="${GITHUB_SHA}"
          for i in $(seq 1 60); do
            COMMIT=$(curl -s https://repair-system-4re.pages.dev/api/hello | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('commit',''))" 2>/dev/null || true)
            if [ "$COMMIT" = "$EXPECTED" ]; then echo "新版已上線 (${COMMIT})"; exit 0; fi
            echo "等待部署到 ${EXPECTED}（目前 ${COMMIT:-unknown}, $i/90）..."
            sleep 10
          done
          echo "部署版本比對失敗：預期 ${EXPECTED}，實際 ${COMMIT}"
          exit 1

      - name: Run E2E tests
        run: npx playwright test
        env:
          E2E_BASE_URL: https://repair-system-4re.pages.dev
